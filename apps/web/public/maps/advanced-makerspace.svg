<svg xmlns="http://www.w3.org/2000/svg" width="1333" height="507" viewBox="0 0 1333 507" role="img" aria-labelledby="title description">
  <title id="title">Advanced Makerspace</title>
  <desc id="description">Advanced Makerspace storage surfaces run Z through T from the lower-left table up the left wall, across the top, down the right wall, and along the bottom. The toolbox occupies the former coat-rack area at the upper left. Open room floor extends directly beneath the upper-left post. The fire cabinet has its back against the left wall and its doors facing into the room, not against the post. Named cabinets and equipment retain their names. This diagram is not to scale.</desc>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #20384b; text-anchor: middle; }
    .floor { fill: #f8fafc; stroke: #526776; stroke-width: 4; }
    .surface { fill: #e0ecf4; stroke: #7895a9; stroke-width: 2; }
    .station { fill: #dff0eb; stroke: #638a7f; stroke-width: 2; }
    .cabinet { fill: #fff0d4; stroke: #aa8750; stroke-width: 2; }
    .landmark { fill: #e9edf0; stroke: #a5b3bd; stroke-width: 2; }
    .label { font-size: 26px; font-weight: 600; }
    .letter { font-size: 32px; font-weight: 700; }
    .small { font-size: 16px; font-weight: 600; letter-spacing: 1px; fill: #415d70; }
  </style>
  <rect width="1333" height="507" fill="#fff"/>
  <!-- Same source-image coordinates as the original plan, so existing catalog pins still align. -->
