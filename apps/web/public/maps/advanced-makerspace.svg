  <title
     id="title">Advanced Makerspace</title>
  <desc
     id="description">Advanced Makerspace storage surfaces run S through Z: Table S is at the left-center, Tables T and U are along the bottom-left, Table V is at the center, Table W is on the right, and Table X, Table Y, and Workbench Z run across the top from right to left. The toolbox occupies the former coat-rack area at the upper left. Open room floor extends directly beneath the upper-left wall projection. The fire cabinet has its back against the left wall and its doors facing into the room. Named cabinets and equipment retain their names. This diagram is not to scale.</desc>
