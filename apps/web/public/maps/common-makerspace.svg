<svg xmlns="http://www.w3.org/2000/svg" width="1555" height="982" viewBox="0 0 1555 982" role="img" aria-labelledby="title description">
  <title id="title">Common Makerspace</title>
  <desc id="description">Common Makerspace storage surfaces run A through M from the upper-left desk down the left wall, across the bottom, up the right wall, and along the top. Six central work tables are unlettered and must remain clear of stored items. The toolbox is in Advanced Makerspace. This diagram is not to scale.</desc>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #20384b; text-anchor: middle; }
    .floor { fill: #f8fafc; stroke: #526776; stroke-width: 4; }
    .surface { fill: #e0ecf4; stroke: #7895a9; stroke-width: 2; }
    .island { fill: #edf0f2; stroke: #8b9aa5; stroke-width: 2; }
    .station { fill: #dff0eb; stroke: #638a7f; stroke-width: 2; }
    .cabinet { fill: #fff0d4; stroke: #aa8750; stroke-width: 2; }
    .landmark { fill: #e9edf0; stroke: #a5b3bd; stroke-width: 2; }
    .label { font-size: 26px; font-weight: 600; }
    .letter { font-size: 34px; font-weight: 700; }
    .small { font-size: 16px; font-weight: 600; letter-spacing: 1px; fill: #415d70; }
    .window { stroke: #53a5bd; stroke-width: 6; }
    .entry { stroke: #416170; stroke-width: 3; stroke-dasharray: 8 6; }
  </style>
  <rect width="1555" height="982" fill="#fff"/>
