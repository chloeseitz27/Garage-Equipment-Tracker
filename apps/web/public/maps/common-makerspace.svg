  <title
     id="title">Common Makerspace</title>
  <desc
     id="description">Common Makerspace storage surfaces run A through M clockwise from the top-right table: down the right wall, right to left across the bottom, up the left wall, and along the top. Six central work tables are unlettered and must remain clear of stored items. The toolbox is in Advanced Makerspace. This diagram is not to scale.</desc>
